name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate consumer-mode version boundary
        run: bash scripts/validate-consumer-mode-boundary.sh

  build:
    needs: validate
    uses: kube-kaptain/buildon-github-actions/.github/workflows/layer-and-layerset-build.yaml@1.1.46
    permissions:
      contents: write
      packages: write
      checks: write
